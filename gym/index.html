<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GYM DİZAYN</title>
<link rel="manifest" href="/gym/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GYM DİZAYN">
<meta name="theme-color" content="#1F2937">
<link rel="apple-touch-icon" href="/app/icon-192.png">
<style>body{margin:0;background:#FFF6E8;font:600 15px system-ui;color:#5b4a1a;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head><body><div id="ld">GYM DİZAYN yükleniyor…</div>
<script>
(async () => {
  const U = '/app/index.html';
  let s = null;
  try { const r = await fetch(U + '?t=' + Date.now(), {cache: 'no-store'}); if (r.ok) s = await r.text(); } catch (e) {}
  if (!s && 'caches' in window) { try { const m = await caches.match(U) || await caches.match('/app/'); if (m) s = await m.text(); } catch (e) {} }
  if (!s) { document.getElementById('ld').textContent = 'İnternet bağlantısı yok. Bağlanınca tekrar deneyin.'; return; }
  s = s.replace('<head>', '<head>\n<base href="../app/">')
       .replace('<title>GYM DİZAYN</title>', '<title>GYM DİZAYN</title>')
       .replace('<meta name="apple-mobile-web-app-title" content="GYM DİZAYN">', '<meta name="apple-mobile-web-app-title" content="GYM DİZAYN">')
       .replace('<link rel="manifest" href="manifest.json">', '<link rel="manifest" href="/gym/manifest.json">')
       .replace('<h1 id="ttl">GYM DİZAYN</h1>', '<h1 id="ttl">GYM DİZAYN</h1>');
  document.open(); document.write(s); document.close();
})();
</script></body></html>
