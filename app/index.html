<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GYM DİZAYN</title>
<meta name="theme-color" content="#1F2937">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYM DİZAYN">
<style>
:root{--dark:#1F2937;--cream:#FFF6E8;--amber:#F3A712;--orange:#E4572E;--ink:#1b1b1b;--mut:#6b5d4b;--line:#ead9bf;--card:#fff;--teal:#0B5A55;--ok:#00825A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit}
header{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{margin:0;font-size:18px;letter-spacing:.5px}
.brand small{display:block;color:var(--amber);font-style:italic;font-size:11px;margin-top:1px}
.mode{display:flex;background:#111827;border-radius:10px;padding:3px;flex-shrink:0}
.mode button{border:0;background:transparent;color:#cbd5e1;padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer}
.mode button.on{background:var(--amber);color:#1b1b1b}
main{padding:10px 12px 90px;max-width:1100px;margin:0 auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;border:0;background:none;padding:9px 4px 8px;font-size:12px;color:var(--mut);cursor:pointer;position:relative}
nav.bottom button b{display:block;font-size:20px;line-height:22px}
nav.bottom button.on{color:var(--orange);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--orange);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.filters .full{grid-column:1/-1}
input[type=search],select,input[type=text],input[type=date],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.phinfo{background:#DDF3F1;color:var(--teal);border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:8px}
.count{color:var(--mut);font-size:13px;margin:4px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .im{background:#f4efe6;aspect-ratio:480/230;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:contain}
.sp{width:100%;aspect-ratio:480/230;background-repeat:no-repeat;background-color:#f4efe6}
.card .im .sp{height:auto}
.sheet .sp{border-radius:10px}
.pi .top .th{width:110px;flex-shrink:0;cursor:pointer;border-radius:8px;overflow:hidden}
.pi .top .th img{width:100%}
.card .im .noimg{padding:10px 12px;font-size:12px;color:#5b4a1a;background:#FFF2CC;width:100%;height:100%;overflow:hidden;white-space:pre-line;text-align:left}
.card .bd{padding:9px 11px;flex:1;display:flex;flex-direction:column;gap:5px}
.code{font-size:11px;font-weight:800;color:#fff;background:var(--dark);border-radius:6px;padding:1px 6px;margin-right:6px}
.nm{font-weight:700;line-height:1.25}
.en{color:var(--mut);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;background:#FCE9C8;color:#6b4526;border-radius:6px;padding:2px 6px}
.chip.r{background:#DDF3F1;color:var(--teal);font-weight:700}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.btn{border:0;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:13px}
.b3d{background:#FDE3D9;color:var(--orange)}
.bvid{background:#E7EEF7;color:#1F4E79}
.badd{background:var(--amber);color:#1b1b1b;margin-left:auto}
.badd.in{background:var(--ok);color:#fff}
.more{display:block;margin:14px auto;background:var(--dark);color:#fff}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet img{width:100%;border-radius:10px;background:#f4efe6}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:14px;margin:10px 0}
.kv div:nth-child(odd){color:var(--mut)}
.steps{white-space:pre-line;background:#FFF8EA;border-radius:10px;padding:10px;font-size:14px}
.x{float:right;background:#eee;border:0;border-radius:20px;width:34px;height:34px;font-size:18px;cursor:pointer}
.pform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pform .full{grid-column:1/-1}
label.l{font-size:12px;color:var(--mut);display:block;margin:0 0 3px 2px}
.sec{font-weight:800;color:#fff;background:var(--teal);border-radius:8px;padding:5px 10px;margin:12px 0 6px;font-size:13px}
.pi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:8px}
.pi .top{display:flex;gap:8px;align-items:flex-start}
.pi .top img{width:96px;border-radius:8px;background:#f4efe6;flex-shrink:0;cursor:pointer}
.pi .top .t{flex:1;min-width:0}
.pi .row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:7px}
.pi .row>div{min-width:0}
html,body{overflow-x:hidden}
.pi .row input{padding:7px 4px;font-size:13px;text-align:center;width:100%}
.pi .row label{font-size:10px;color:var(--mut);text-align:center;display:block}
.pi .nt{margin-top:6px}
.pi .ctl{display:flex;flex-direction:column;gap:4px}
.pi .ctl button{border:0;background:#f1e7d6;border-radius:7px;width:32px;height:28px;cursor:pointer}
.pi .ctl button.del{background:#fde0d8;color:#c00}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.bar .btn{flex:1;min-width:130px;padding:11px}
.bsave{background:var(--ok);color:#fff}.bpdf{background:#C00000;color:#fff}.bshare{background:#25D366;color:#fff}.bclear{background:#ddd;color:#333}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.sv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.sv .t{flex:1;min-width:0}
.sv .t b{display:block}
.sv .t span{font-size:12px;color:var(--mut)}
.tag{font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;color:#fff;background:var(--dark);margin-right:4px}
.tag.s{background:#2e7d32}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:9px 14px;border-radius:10px;z-index:60;opacity:0;transition:.25s;pointer-events:none;font-size:14px}
.toast.on{opacity:1}
#print{display:none}
footer.sig{text-align:center;font-size:11px;color:var(--mut);margin-top:20px}
@media (max-width:420px){.list{grid-template-columns:1fr}.pi .row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media print{
 @page{size:A4 landscape;margin:10mm}
 html,body{background:#fff!important}
 header,main,nav.bottom,.sheet,.toast{display:none!important}
 #print{display:block;font-size:10.5px;color:#000}
 #print h2{margin:0 0 2px;font-size:18px}
 #print .hd{display:flex;justify-content:space-between;border-bottom:3px solid var(--amber);padding-bottom:6px;margin-bottom:6px}
 #print .hd .r{text-align:right;font-size:11px}
 #print table{width:100%;border-collapse:collapse}
 #print th{background:#1F2937;color:#fff;padding:5px;font-size:10px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #print td{border-bottom:1px solid #ddd;padding:4px 5px;vertical-align:top}
 #print td.s{background:#DDF3F1;font-weight:700;color:#0B5A55;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #print img{width:120px}
 #print .th{width:120px} #print .sp{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #print a{color:#C00000;font-weight:700;text-decoration:none}
 #print .ft{margin-top:8px;font-size:9.5px;color:#555;display:flex;justify-content:space-between}
 #print tr{page-break-inside:avoid}
}
.adm{border:0;background:#111827;color:#fff;border-radius:10px;padding:7px 9px;font-size:16px;cursor:pointer}
.fbar{display:flex;gap:8px;margin:-2px 0 8px;flex-wrap:wrap}.fbar .btn{padding:7px 10px}
.more2{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:5px;background:#bbb;vertical-align:middle}
.dot.ok{background:#2E7D32}.dot.busy{background:var(--amber)}.dot.off{background:#C62828}
.login{max-width:420px;margin:30px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.login h2{margin:0 0 4px}.lgmsg{min-height:20px;font-size:13px;margin-top:8px}
input[type=password]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
body.nolog nav.bottom,body.nolog .mode{display:none}
.acct{margin-top:18px;font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res{padding:7px 2px;text-align:center;font-weight:800;font-size:13px;background:#f7f1e6;border-radius:8px}
.pi .row.tr{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:420px){.pi .row.tr{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.pi .row.tr input{font-size:14px}}
</style>
<script src="lib/supabase.min.js"></script>
</head>
<body>
<header>
 <div class="brand">
  <div><h1 id="ttl">GYM DİZAYN</h1><small>Dr. İsmail Çiçek · UEFA Fitness Coach · @powerforce_athletic</small></div>
  <div style="display:flex;gap:6px;align-items:center"><button id="admin" class="adm" hidden title="Lisans yönetimi">🔑</button><div class="mode"><button data-m="gym" class="on">GYM</button><button data-m="saha">SAHA</button></div></div>
 </div>
</header>
<main id="main"><div class="empty">Yükleniyor…</div></main>
<nav class="bottom">
 <button data-v="lib" class="on"><b>☰</b>Kütüphane</button>
 <button data-v="prog"><b>✎</b>Program<span class="badge" id="badge" hidden>0</span></button>
 <button data-v="saved"><b>★</b>Kayıtlı</button>
 <button data-v="ath"><b>👤</b>Sporcular</button>
</nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<div id="print"></div>
<script>
const ROOT = '../';           // animasyonlar sitenin kökünde (Gorseller/, Saha_Gorseller/)
const MDS = ["MD+1","MD+2","MD-4","MD-3","MD-2","MD-1"];
const S = {mode:'gym', view:'lib', data:{}, limit:40, f:{gym:{q:'',grp:'',md:'',ph:''}, saha:{q:'',cat:'',md:''}}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true }catch(e){ return false } }
};
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),1800) }
const norm = s => String(s||'').toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i');

/* ---------- veri ---------- */
async function load(m){
  if (S.data[m]) return S.data[m];
  const r = await fetch('data/'+m+'.json'); const d = await r.json();
  d.items.forEach(x => { x._s = norm([x.c,x.t,x.en,x.k,x.p,x.eq,x.m,x.s,x.ph].join(' ')) });
  d.by = Object.fromEntries(d.items.map(x=>[x.c,x]));
  return S.data[m] = d;
}
const linkA = a => !a ? '' : (/^https?:/.test(a) ? a : ROOT + a);
const imgOf = (m,x) => m==='gym' ? (x.im && S.data.gym.sp[x.im] ? 1 : '') : (x.png ? ROOT + x.png : '');
function thumb(m,x,extra=''){
  if (m==='gym'){ const p=S.data.gym.sp[x.im]; if(!p) return ''; const [s,c,r,rows]=p;
    return `<div class="sp" ${extra} style="background-image:url(sp/s${s}.jpg);background-size:1000% ${rows*100}%;background-position:${c/9*100}% ${rows>1?r/(rows-1)*100:0}%"></div>` }
  return x.png ? `<img loading="lazy" src="${ROOT+x.png}" ${extra} alt="">` : '';
}
const vidOf = (m,x) => m==='gym' ? (x.v||'') : (/^https?:/.test(x.a||'') ? x.a : '');
const animOf = (m,x) => m==='gym' ? linkA(x.a) : (/^https?:/.test(x.a||'') ? '' : linkA(x.a));
const groupName = (m,x) => m==='gym' ? (S.data.gym.groups[x.g] || x.k) : x.k;

/* ---------- program (taslak) ---------- */
const draftKey = m => 'pf_draft_'+m;
function draft(m=S.mode){ return store.get(draftKey(m), {name:'',ath:'',date:new Date().toISOString().slice(0,10),md:'',note:'',items:[]}) }
function saveDraft(d, m=S.mode){ store.set(draftKey(m), d); badge() }
function splitSR(sr){ const m = String(sr||'').match(/^\s*([\d\-–]+)\s*x\s*(.+)$/i); return m ? [m[1], m[2]] : ['', String(sr||'')] }
function inDraft(c){ return draft().items.some(i=>i.c===c) }
function toggle(c){
  const d = draft(); const i = d.items.findIndex(x=>x.c===c);
  if (i>=0){ d.items.splice(i,1); toast('Programdan çıkarıldı') }
  else{
    const x = S.data[S.mode].by[c];
    let dose = S.mode==='gym' ? x.sr : x.d;
    const ph = S.f.gym.ph;
    if (S.mode==='gym' && ph && S.data.gym.phase_dose[ph+'|'+c]) dose = S.data.gym.phase_dose[ph+'|'+c];
    const [set, rep] = S.mode==='gym' ? splitSR(dose) : splitSR(dose);
    d.items.push({c, set, rep, load: S.mode==='gym' ? (x.i||'') : (x.i||''), tempo: S.mode==='gym' ? (x.tp||'') : (x.ar||''), rest: x.rs||'', note:''});
    toast('Programa eklendi ✓');
  }
  saveDraft(d); render();
}
function badge(){ const n = draft().items.length; const b=$('#badge'); b.hidden = !n; b.textContent = n }

/* ---------- kütüphane ---------- */
const splitTok = (v, re) => String(v||'').split(re).map(x=>x.trim()).filter(x=>x && x!=='—' && x!=='–');
const GF = [  // [anahtar, etiket, alan, tür]  tür: eq = tam eşleşme, tok = parçalı
  ['k','Ana kategori','k','eq'], ['p','Hareket paterni','p','eq'], ['d','Dominantlık','d','eq'], ['f','Fokus','f','eq'],
  ['l','Uni / Bilateral','l','eq'], ['lv','Seviye','lv','eq'], ['h','Antrenman hedefi','h','eq'],
  ['eq','Ekipman','eq','tok'], ['mus','Hedef kas','m','tok'], ['dn','Uygun dönem','dn','tok']];
const SF = [['s','Alt tür','s','eq'], ['ld','Yük profili','ld','eq'], ['n','Oyuncu sayısı','n','eq']];
const TOKRE = {eq:/\s*(?:\+|\/|,|·|&)\s*/, m:/,\s*|\s*\(\+\s*|\)/, dn:/\s*·\s*/};
function tokOf(x, field){ let t=splitTok(x[field], TOKRE[field]||/,/); if(field==='dn') t=t.map(v=>v.replace(/\s*\(.*\)$/,'')); return t }
function facet(m, field, kind){
  const c={}; S.data[m].items.forEach(x=>{ (kind==='tok'?tokOf(x,field):[x[field]]).forEach(v=>{ if(v===undefined||v===null||v===''||v==='—') return; v=String(v); c[v]=(c[v]||0)+1 }) });
  return Object.entries(c).sort((a,b)=> field==='lv' ? a[0]-b[0] : b[1]-a[1]).slice(0, kind==='tok'?40:200);
}
function filtered(){
  const m=S.mode, d=S.data[m], f=S.f[m], q=norm(f.q).split(/\s+/).filter(Boolean);
  let phInj=null, phTag=null;
  if (m==='gym' && f.ph){ const mm = f.ph.match(/^(.+?) – Faz (\d+)/); if(mm){ const inj = d.inj.find(z=>z[1]===mm[1]||z[0]===mm[1]); phInj = inj ? inj[0] : null; phTag='F'+mm[2] } }
  const extra = (m==='gym'?GF:SF).filter(([k])=>f[k]);
  return d.items.filter(x =>
    (!q.length || q.every(t=>x._s.includes(t))) &&
    (m!=='gym' || !f.grp || String(x.g)===f.grp || (S.data.gym.groups[x.g]===f.grp)) &&
    (m!=='saha' || !f.cat || x.k===f.cat) &&
    (!f.md || (x.md||[]).includes(f.md)) &&
    (!phInj || ((x.rh||{})[phInj]||'').split(' · ').includes(phTag)) &&
    extra.every(([k,,field,kind]) => kind==='tok' ? tokOf(x,field).includes(f[k]) : String(x[field])===f[k])
  );
}
function cardHTML(x){
  const m=S.mode, im=imgOf(m,x), an=animOf(m,x), vd=vidOf(m,x), on=inDraft(x.c);
  const chips = m==='gym'
    ? [x.k, x.eq, x.sr, x.i].filter(Boolean).map(t=>`<span class="chip">${esc(t)}</span>`).join('') + Object.entries(x.rh||{}).filter(()=>S.f.gym.ph).slice(0,0).join('')
    : [x.s, x.n?x.n+' oyuncu':'', x.ar, x.d].filter(Boolean).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
  const body = im ? thumb(m,x) : `<div class="noimg">${esc(x.nt || x.ru || 'SAHA · yalnızca video ▶')}</div>`;
  return `<div class="card"><div class="im" data-d="${x.c}">${body}</div><div class="bd">
   <div class="nm"><span class="code">${esc(x.c)}</span>${esc(x.t)}</div>${x.en?`<div class="en">${esc(x.en)}</div>`:''}
   <div class="chips">${chips}</div>
   <div class="acts">${an?`<a class="btn b3d" href="${an}" target="_blank" rel="noopener">▶ ${m==='gym'?'3D':'Hareketli'}</a>`:''}${vd?`<a class="btn bvid" href="${vd}" target="_blank" rel="noopener">▶ Video</a>`:''}
   <button class="btn badd ${on?'in':''}" data-a="${x.c}">${on?'✓ Eklendi':'+ Ekle'}</button></div></div></div>`;
}
function libHTML(){
  const m=S.mode, d=S.data[m], f=S.f[m];
  const opt = (arr, sel, ph) => `<option value="">${ph}</option>` + arr.map(v=>{ const [val,n]=Array.isArray(v)?v:[v]; return `<option ${String(val)===String(sel)?'selected':''} value="${esc(val)}">${esc(val)}${n?` (${n})`:''}</option>` }).join('');
  const defs = m==='gym'?GF:SF, act = defs.filter(([k])=>f[k]).length;
  let fl;
  if (m==='gym'){
    const grps=[...new Set(Object.values(d.groups))];
    fl = `<input class="full" type="search" id="q" placeholder="Ara: squat, nordic, KD-23, hamstring…" value="${esc(f.q)}">
     <select data-f="grp">${opt(grps,f.grp,'Tüm gruplar')}</select>
     <select data-f="md">${opt(MDS,f.md,'Tüm MD günleri')}</select>
     <select class="full" data-f="ph">${opt(d.phases,f.ph,'Rehab / RTP fazı (hepsi)')}</select>`;
  } else {
    const cats=[...new Set(d.items.map(x=>x.k))];
    fl = `<input class="full" type="search" id="q" placeholder="Ara: SSG, rondo, sprint, ACL…" value="${esc(f.q)}">
     <select data-f="cat">${opt(cats,f.cat,'Tüm kategoriler')}</select>
     <select data-f="md">${opt(MDS,f.md,'Tüm MD günleri')}</select>`;
  }
  const more = S.more ? `<div class="filters more2">${defs.map(([k,l,field,kind])=>`<div><label class="l">${l}</label><select data-f="${k}">${opt(facet(m,field,kind),f[k],'Hepsi')}</select></div>`).join('')}</div>` : '';
  const anyF = Object.entries(f).some(([k,v])=>v && k!=='q') || f.q;
  const L = filtered();
  const info = (m==='gym' && f.ph) ? `<div class="phinfo"><b>${esc(f.ph)}</b><br>${esc(d.phase_info[f.ph]||'')}</div>` : '';
  return `<div class="filters">${fl}</div>

function dbSave(){ store.set('pf_db_v1', DB.s) }
function dbList(tur){ return Object.entries(DB.s.recs).filter(([,r])=>r.tur===tur && !r.del).map(([id,r])=>({...r.veri, id})) }
function dbGet(id){ const r=DB.s.recs[id]; return r && !r.del ? {...r.veri, id} : null }
function dbPut(tur, id, veri){ const v={...veri}; delete v.id; DB.s.recs[id]={tur, veri:v, t:now(), dirty:1}; dbSave(); sync() }
function dbDel(id){ const r=DB.s.recs[id]; if(!r) return; r.del=1; r.dirty=1; r.t=now(); dbSave(); sync() }
function setSync(st){ S.sync=st; const e=$('#syncDot'); if(e){ e.className='dot '+st; e.title = st==='ok'?'Bulutla eşit':st==='busy'?'Eşitleniyor…':'Çevrimdışı – sonra eşitlenecek' } }
let syncing=false, syncAgain=false;
async function sync(){
  if (!sb || !S.user) return;
  if (syncing){ syncAgain=true; return }
  syncing=true; setSync('busy');
  try{
    const dirty = Object.entries(DB.s.recs).filter(([,r])=>r.dirty);
    if (dirty.length){
      const {error} = await sb.from('kayitlar').upsert(dirty.map(([id,r])=>({id, tur:r.tur, veri:r.veri, silindi:!!r.del})));
      if (error) throw error;
      dirty.forEach(([id])=>{ if(DB.s.recs[id]) delete DB.s.recs[id].dirty });
    }
    let got=0;
    for (let page=0; page<50; page++){
      let q = sb.from('kayitlar').select('id,tur,veri,silindi,guncelleme').order('guncelleme',{ascending:true}).limit(500);
      if (DB.s.last) q = q.gt('guncelleme', DB.s.last);
      const {data, error} = await q; if (error) throw error;
      data.forEach(row=>{ const loc=DB.s.recs[row.id]; if(!(loc && loc.dirty)) DB.s.recs[row.id]={tur:row.tur, veri:row.veri, t:row.guncelleme, del:row.silindi}; DB.s.last=row.guncelleme });
      got += data.length; if (data.length<500) break;
    }
    dbSave(); setSync('ok');
    if (got) softRender();
  }catch(e){ console.warn('sync', e); setSync('off') }
  finally{ syncing=false; if(syncAgain){ syncAgain=false; setTimeout(sync, 300) } }
}

const TD = () => S.data.tests;
const tByC = c => TD().by[c];
const num = v => { if(v===null||v===undefined||v==='') return null; const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?null:n };
const r1 = v => v==null ? '' : (Math.round(v*100)/100).toString().replace('.',',');
const RL = ['Zayıf','Orta','İyi','Çok iyi','Elit'], RC = ['#C62828','#EF6C00','#9E9D24','#2E7D32','#00695C'];
function evalTest(t, it, side){
  const R=num(it.r), L=num(it.l), V=num(it.v), hy=t.hy||1;
  let res=null, lsi=null;
  if (t.md && R!=null && L!=null){
    let inv, un;
    if (side==='Sağ'){ inv=R; un=L } else if (side==='Sol'){ inv=L; un=R } else { inv = hy>0?Math.min(R,L):Math.max(R,L); un = hy>0?Math.max(R,L):Math.min(R,L) }
    lsi = (un && inv) ? (hy>0 ? inv/un*100 : un/inv*100) : null;
    res = t.md==='LSI'||t.md==='LSIT' ? lsi : t.md==='ZAYIF' ? (hy>0?Math.min(R,L):Math.max(R,L)) : t.md==='FARK' ? Math.abs(R-L) : t.md==='TOPLAM' ? R+L : t.md==='ENIYI' ? (hy>0?Math.max(R,L):Math.min(R,L)) : lsi;
  }
  if (res==null) res=V;
  let rate='', col='#777';
  const th=(t.th||[]).filter(x=>x!=null);
  if (res!=null && th.length){
    if (t.y===1){ const k=th.filter(x=>res>=x).length; rate=RL[Math.min(k,4)]; col=RC[Math.min(k,4)] }
    else if (t.y===-1){ const k=th.filter(x=>res<=x).length; rate=RL[Math.min(k,4)]; col=RC[Math.min(k,4)] }
    else if (t.y===2){ const ok=res>=th[0]; rate=ok?'Geçti':'Kaldı'; col=ok?RC[3]:RC[0] }
    else if (t.y===-2){ const ok=res<=th[0]; rate=ok?'Geçti':'Kaldı'; col=ok?RC[3]:RC[0] }
  }
  let lsiBad = lsi!=null && t.lsi && lsi < t.lsi;
  return {res, lsi, rate, col, lsiBad};
}

    doc.autoTable({ startY:32, margin:{left:10,right:10,bottom:12}, head:[['#','Test','Birim','Sağ','Sol','Değer','Sonuç','LSI','Değerlendirme','Hedef / kriter','Video']], body,
      styles:{font:'dv', fontSize:8.2, cellPadding:1.6, valign:'middle', textColor:[25,25,25], lineColor:[230,220,200], lineWidth:.1}, headStyles:{fillColor:[31,41,55], textColor:255, fontStyle:'bold'},
      columnStyles:{0:{cellWidth:7},1:{cellWidth:63},2:{cellWidth:18},3:{cellWidth:13},4:{cellWidth:13},5:{cellWidth:15},6:{cellWidth:16,fontStyle:'bold'},7:{cellWidth:15},8:{cellWidth:27,fontStyle:'bold'},9:{cellWidth:60},10:{cellWidth:20}},
      didParseCell: dc => { if(dc.section==='body' && dc.column.index===8){ const mt=meta[dc.row.index]; if(mt && /^#[0-9A-Fa-f]{6}$/.test(mt.col)){ const h=mt.col.replace('#',''); dc.cell.styles.textColor=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)] } } },
      didDrawCell: dc => { if(dc.section==='body' && dc.column.index===10){ const mt=meta[dc.row.index]; if(mt && mt.v){ doc.setFont('dv','bold'); doc.setFontSize(8.5); doc.setTextColor(192,0,0); doc.textWithLink('▶ Video', dc.cell.x+2, dc.cell.y+dc.cell.height/2+1.5, {url:mt.v}) } } } });
    pdfFooter(doc);
    await deliverPdf(doc, 'Test ' + (a.ad||'') + ' ' + trDate(t.date));
  }catch(e){ console.error(e); toast('PDF oluşturulamadı – internet bağlantını kontrol et'); }
}

/* ---------- çizim + olaylar ---------- */
async function render(){
  document.body.classList.toggle('nolog', !S.user);
  if (!S.user){ $('#main').innerHTML = loginHTML(); return }
  if (sb && S.user.id!=='local' && !(S.lic && S.lic.gecerli)){ document.body.classList.add('nolog'); $('#main').innerHTML = licHTML(); return }
  const m=S.mode; await load(m); if(S.view==='ath') await loadTests();
  $('#ttl').textContent = S.view==='ath' ? 'SPORCULAR' : (m==='gym' ? 'GYM DİZAYN' : 'SAHA DİZAYN');
  document.querySelectorAll('.mode button').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.view));
  const body = S.view==='lib' ? libHTML() : S.view==='prog' ? progHTML() : S.view==='saved' ? savedHTML() : (S.av&&S.av.p==='admin') ? adminHTML() : athHTML();
  $('#main').innerHTML = body + `<datalist id="athl">${aths().map(a=>`<option value="${esc(a.ad)}">`).join('')}</datalist><footer class="sig">Dr. İsmail Çiçek · UEFA Fitness Coach · Instagram: @powerforce_athletic</footer>`;
  badge();
  const ab=$('#admin'); if(ab) ab.hidden = !(S.lic && S.lic.yonetici);
}
async function loadTests(){
  if (S.data.tests) return; const r=await fetch('data/tests.json'); const d=await r.json(); d.by=Object.fromEntries(d.tests.map(t=>[t.c,t])); S.data.tests=d;
}
let qT;
document.addEventListener('input', e=>{
  const t=e.target;
  if (t.id==='q'){ clearTimeout(qT); qT=setTimeout(()=>{ S.f[S.mode].q=t.value; S.limit=40; const p=t.selectionStart; render().then(()=>{ const q=$('#q'); q.focus(); q.setSelectionRange(p,p) }) },250) }
  if (t.id==='aq' || t.id==='tq'){ clearTimeout(qT); qT=setTimeout(()=>{ S[t.id]=t.value; const p=t.selectionStart, id=t.id; render().then(()=>{ const q=$('#'+id); q.focus(); q.setSelectionRange(p,p) }) },250) }
  if (t.dataset.h){ const d=draft(); d[t.dataset.h]=t.value; saveDraft(d) }
  if (t.dataset.k){ const i=+t.closest('.pi').dataset.i, d=draft(); d.items[i][t.dataset.k]=t.value; saveDraft(d) }
  if (t.dataset.tf){ const d=tdraft(); d[t.dataset.tf]=t.value; setTdraft(d) }
  if (t.dataset.tk){ const box=t.closest('.pi'), i=+box.dataset.ti, d=tdraft(); d.items[i][t.dataset.tk]=t.value; setTdraft(d);
    const x=tByC(d.items[i].c), ev=evalTest(x,d.items[i],d.side), rs=box.querySelectorAll('.res');
    rs[0].textContent = ev.res!=null?r1(ev.res):'—'; rs[1].textContent = ev.lsi!=null?'%'+r1(ev.lsi):'—'; rs[1].style.color = ev.lsiBad?'#C62828':''; rs[2].textContent = ev.rate||'—'; rs[2].style.color = ev.col }
});
document.addEventListener('change', e=>{
  const t=e.target, f=S.f[S.mode];
  if (t.dataset.f){ f[t.dataset.f]=t.value; S.limit=40; render() }
  if (t.dataset.h){ const d=draft(); d[t.dataset.h]=t.value; saveDraft(d) }
  if (t.dataset.tf){ const d=tdraft(); d[t.dataset.tf]=t.value; setTdraft(d); if(t.dataset.tf==='side') render() }
  if (t.dataset.athSel){ const d=draft(); if(t.value==='__other'){ S.athOther=1; d.athId='' } else { S.athOther=0; const a=dbGet(t.value); d.ath=a?a.ad:''; d.athId=a?a.id:'' } saveDraft(d); render() }
  if (t.id==='tc'){ S.tc=t.value; render() }
  if (t.id==='impFile' && t.files[0]){ importFile(t.files[0]); t.value='' }
  if (t.id==='tpack' && t.value){ const d=tdraft(); d.pack=t.value; (TD().packs[t.value]||[]).forEach(c=>{ if(!d.items.some(i=>i.c===c)) d.items.push({c}) }); setTdraft(d); render() }
});
document.addEventListener('click', async e=>{
  const t=e.target.closest('button,[data-d],[data-ath]'); if(!t) return;
  if (t.id==='lgIn') return doLogin('in'); if (t.id==='lgUp') return doLogin('up'); if (t.id==='lgFg') return doLogin('fg');
  if (t.id==='logout'){ if(confirm('Çıkış yapılsın mı?')){ await sb.auth.signOut(); DB.s={recs:{},last:null,uid:null}; dbSave(); onUser(null) } return }
  if (t.dataset.m){ S.mode=t.dataset.m; S.limit=40; if(S.view==='ath') S.view='lib'; return render() }
  if (t.dataset.v){ S.view=t.dataset.v; if(S.view==='ath' && (S.av||{}).p!=='test') S.av={p:'list'}; window.scrollTo(0,0); return render() }
  if (t.dataset.a){ toggle(t.dataset.a); if($('#sheet').classList.contains('on')) detail(t.dataset.a); return }
  if (t.dataset.d){ return detail(t.dataset.d) }
  if (t.id==='cls'){ return $('#sheet').classList.remove('on') }
  if (t.id==='more'){ S.limit+=60; return render() }
  if (t.id==='moreF'){ S.more=!S.more; return render() }
  if (t.id==='clrF'){ const f=S.f[S.mode]; Object.keys(f).forEach(k=>f[k]=''); S.limit=40; return render() }
  if (t.dataset.mv||t.dataset.rm){ const i=+t.closest('.pi').dataset.i, d=draft();
    if (t.dataset.rm) d.items.splice(i,1); else { const j=i+(+t.dataset.mv); if(j<0||j>=d.items.length) return; [d.items[i],d.items[j]]=[d.items[j],d.items[i]] }
    saveDraft(d); return render() }
  if (t.id==='save') return saveProgram();
  if (t.id==='pdf') return printProgram(draft(), S.mode);
  if (t.id==='share') return shareProgram();
  if (t.id==='clear'){ if(confirm('Program temizlensin mi? (Kayıtlı programlar silinmez)')){ saveDraft({name:'',ath:'',date:new Date().toISOString().slice(0,10),md:'',note:'',items:[]}); render() } return }
  if (t.dataset.open){ const p=dbGet(t.dataset.open); if(!p) return; S.mode=p.mode||'gym'; await load(S.mode); saveDraft({id:p.id,name:p.name,ath:p.ath,athId:p.athId,date:p.date,md:p.md,note:p.note,items:p.items||[]}, S.mode); S.view='prog'; return render() }
  if (t.dataset.pdf){ const p=dbGet(t.dataset.pdf); return p && printProgram(p, p.mode||'gym') }
  if (t.dataset.del){ if(confirm('Bu kayıtlı program silinsin mi?')){ dbDel(t.dataset.del); render() } return }
  // sporcular
  if (t.dataset.ath){ S.av={p:'det', id:t.dataset.ath}; window.scrollTo(0,0); return render() }
  if (t.dataset.back){ const v=S.av||{}; S.av = v.p==='admin' ? {p:'list'} : v.p==='test' ? {p:'det', id:(tdraft()||{}).athId} : v.p==='edit' && v.id ? {p:'det', id:v.id} : {p:'list'}; return render() }
  if (t.id==='imp'){ return $('#impFile').click() }
  if (t.id==='licRetry'){ await checkLic(); if(S.lic.gecerli) sync(); return render() }
  if (t.id==='admin'){ S.view='ath'; S.av={p:'admin'}; S.adm=null; render(); return adminRefresh() }
  if (t.id==='lRef'){ return adminRefresh() }
  if (t.id==='lAdd'){ const em=($('#lmail').value||'').trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(em)) return toast('Geçerli e-posta yaz');
    const ay=+$('#lsure').value; const {error}=await sb.from('lisanslar').upsert({email:em, ad:$('#lad').value.trim(), bitis:addMonths(today(),ay), aktif:true, notlar:$('#lnot').value.trim()});
    if(error) return toast('Kaydedilemedi: '+error.message); toast('Lisans verildi ✓'); return adminRefresh() }
  if (t.dataset.lext){ const x=(S.adm||[]).find(r=>r.email===t.dataset.lext); const base = x.bitis>today()? x.bitis : today();
    const {error}=await sb.from('lisanslar').update({bitis:addMonths(base,+t.dataset.n), aktif:true}).eq('email',x.email); if(error) return toast(error.message); toast('Uzatıldı ✓'); return adminRefresh() }
  if (t.dataset.ltog){ const x=(S.adm||[]).find(r=>r.email===t.dataset.ltog); const {error}=await sb.from('lisanslar').update({aktif:!x.aktif}).eq('email',x.email); if(error) return toast(error.message); return adminRefresh() }
  if (t.dataset.ldel){ if(!confirm(t.dataset.ldel+' lisansı silinsin mi?')) return; const {error}=await sb.from('lisanslar').delete().eq('email',t.dataset.ldel); if(error) return toast(error.message); return adminRefresh() }
  if (t.id==='athNew'){ S.av={p:'edit'}; return render() }
  if (t.id==='athEdit'){ S.av={p:'edit', id:t.dataset.id}; return render() }
  if (t.id==='athSave'){ const v={}; document.querySelectorAll('[data-af]').forEach(x=>v[x.dataset.af]=x.value.trim()); if(!v.ad) return toast('Ad soyad yaz');
    const id=t.dataset.id||uid(); dbPut('sporcu', id, v); S.av={p:'det', id}; toast('Sporcu kaydedildi ✓'); return render() }
  if (t.id==='athDel'){ if(confirm('Sporcu silinsin mi? (Testleri de silinir)')){ testsOf(t.dataset.id).forEach(x=>dbDel(x.id)); dbDel(t.dataset.id); S.av={p:'list'}; render() } return }
  if (t.id==='tNew'){ await loadTests(); return newTest(t.dataset.id) }
  if (t.id==='pNew'){ const a=dbGet(t.dataset.id); const d=draft(); d.ath=a.ad; d.athId=a.id; saveDraft(d); S.view='lib'; toast(a.ad+' için program: kütüphaneden ekle'); return render() }
  if (t.dataset.tadd){ const d=tdraft(); d.items.push({c:t.dataset.tadd}); setTdraft(d); return render() }
  if (t.dataset.trm!==undefined){ const d=tdraft(); d.items.splice(+t.dataset.trm,1); setTdraft(d); return render() }
  if (t.dataset.tinfo){ return testInfo(t.dataset.tinfo) }
  if (t.id==='tSave') return saveTest();
  if (t.id==='tCancel'){ if(confirm('Test girişi iptal edilsin mi?')){ const a=(tdraft()||{}).athId; setTdraft(null); S.av=a?{p:'det',id:a}:{p:'list'}; render() } return }
  if (t.dataset.topen){ const x=dbGet(t.dataset.topen); setTdraft({...x}); S.av={p:'test'}; return render() }
  if (t.dataset.tpdf){ return printTest(dbGet(t.dataset.tpdf)) }
  if (t.dataset.tdel){ if(confirm('Bu test oturumu silinsin mi?')){ dbDel(t.dataset.tdel); render() } return }
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.target.id==='lgPass'||e.target.id==='lgMail')) doLogin('in') });
$('#sheet').addEventListener('click', e=>{ if(e.target.id==='sheet') $('#sheet').classList.remove('on') });
(async()=>{
  try{
    if (!sb){ S.user={id:'local', email:''}; return render() }      // kütüphane yüklenemezse yerel çalış
    const {data} = await sb.auth.getSession();
    sb.auth.onAuthStateChange((ev, ses)=>{ const u=ses?ses.user:null; if((u&&u.id)!==(S.user&&S.user.id)) onUser(u) });
    await onUser(data.session ? data.session.user : null);
  }catch(err){ $('#main').innerHTML='<div class="empty">Yüklenemedi. İnternet bağlantını kontrol et.</div>'; console.error(err) }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
